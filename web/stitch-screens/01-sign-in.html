<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In - Synapse Social</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {

                    "colors": {

                        "on-primary-fixed-variant": "#5a5c5c",
                        "background": "#09090b",
                        "surface": "#18181b",

                        "on-error": "#490013",

                        "secondary-fixed-dim": "#d6d3d8",
                        "inverse-surface": "#fcf8fb",
                        "outline": "#27272a",
                        "inverse-on-surface": "#565457",
                        "on-primary-container": "#d0d0d0",
                        "error-dim": "#ef4444",
                        "secondary-container": "#27272a",
                        "tertiary-fixed-dim": "#c3cfeb",
                        "outline-variant": "#27272a",
                        "surface-bright": "#2b2c32",
                        "primary": "#ffffff",
                        "on-surface": "#ffffff",
                        "tertiary-fixed": "#d1ddfa",
                        "surface-container-highest": "#25252b",
                        "secondary": "#a1a1aa",
                        "on-secondary-fixed-variant": "#5c5b5f",
                        "on-primary-fixed": "#3e4040",
                        "surface-container-high": "#27272a",
                        "primary-fixed": "#e2e2e2",
                        "surface-container-lowest": "#000000",
                        "primary-dim": "#b8b9b9",
                        "on-tertiary-fixed-variant": "#4c5870",
                        "inverse-primary": "#5e5f60",
                        "secondary-dim": "#9f9da1",
                        "error-container": "#7f2737",
                        "on-error-container": "#ff97a3",
                        "surface-container-low": "#18181b",
                        "on-tertiary-fixed": "#303c53",
                        "on-surface-variant": "#a1a1aa",
                        "primary-fixed-dim": "#d4d4d4",
                        "surface-dim": "#09090b",
                        "surface-container": "#18181b",
                        "on-tertiary-container": "#434e66",
                        "on-secondary": "#202023",
                        "tertiary-dim": "#c3cfeb",
                        "error": "#ef4444",
                        "on-secondary-fixed": "#3f3f43",
                        "tertiary": "#e4ebff",
                        "secondary-fixed": "#e4e1e6",
                        "primary-container": "#ffffff",
                        "on-background": "#ffffff",
                        "surface-variant": "#27272a",
                        "tertiary-container": "#d1ddfa",
                        "on-secondary-container": "#c1bec3",
                        "zinc-400": "#a1a1aa",
                        "zinc-500": "#71717a",
                        "zinc-700": "#3f3f46",
                        "zinc-800": "#27272a",
                        "zinc-900": "#18181b",
                        "zinc-950": "#09090b",
                        "blue-500": "#3b82f6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.5rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Geist", "sans-serif"],
                        "display": ["Geist", "sans-serif"],
                        "body": ["Geist", "sans-serif"],
                        "label": ["Geist", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Geist', sans-serif; }
        .bg-grid-pattern {
            background-image: linear-gradient(to right, #27272a 1px, transparent 1px),
                              linear-gradient(to bottom, #27272a 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col md:flex-row font-body">
<!-- Left Side: Branding & Features -->
<div class="hidden md:flex md:w-1/2 bg-zinc-950 relative overflow-hidden items-center justify-center p-12">
<!-- Grid Pattern Overlay -->
<div class="absolute inset-0 bg-grid-pattern opacity-20"></div>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 bg-gradient-to-b from-zinc-950/50 via-zinc-950/80 to-zinc-950"></div>
<div class="relative z-10 flex flex-col items-center text-center max-w-lg">
<!-- Logo -->
<div class="mb-6 flex items-center justify-center gap-3">
<span class="text-4xl text-primary">⚡</span>
<h1 class="text-4xl font-headline font-bold tracking-tight text-primary">Synapse</h1>
</div>
<!-- Tagline -->
<p class="text-lg text-zinc-400 mb-12">Native UI. Shared Logic. Real-time everything.</p>
<!-- Floating Feature Badges -->
<div class="flex flex-wrap justify-center gap-4">
<div class="px-4 py-2 rounded-full bg-zinc-800 border border-zinc-700 text-zinc-300 text-sm font-medium flex items-center gap-2 shadow-lg">
<span class="material-symbols-outlined text-[18px]">forum</span>
                    Real-time Chat
                </div>
<div class="px-4 py-2 rounded-full bg-zinc-800 border border-zinc-700 text-zinc-300 text-sm font-medium flex items-center gap-2 shadow-lg">
<span class="material-symbols-outlined text-[18px]">smart_toy</span>
                    AI Smart Replies
                </div>
<div class="px-4 py-2 rounded-full bg-zinc-800 border border-zinc-700 text-zinc-300 text-sm font-medium flex items-center gap-2 shadow-lg">
<span class="material-symbols-outlined text-[18px]">devices</span>
                    Cross-platform
                </div>
</div>
</div>
</div>
<!-- Right Side: Auth Form -->
<div class="w-full md:w-1/2 bg-zinc-950 flex items-center justify-center p-6 md:p-12 min-h-screen">
<!-- Mobile Logo (visible only on small screens) -->
<div class="md:hidden absolute top-8 left-0 right-0 flex items-center justify-center gap-2 z-10">
<span class="text-2xl text-primary">⚡</span>
<span class="text-2xl font-headline font-bold tracking-tight text-primary">Synapse</span>
</div>
<div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-lg shadow-xl p-8 mt-16 md:mt-0 relative z-20">
<!-- Card Header -->
<div class="text-center mb-8">
<h2 class="text-2xl font-headline font-semibold text-primary tracking-tight mb-2">Welcome back</h2>
<p class="text-sm text-zinc-500">Sign in to your account</p>
</div>
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-3 px-4 py-2.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded-lg text-sm font-medium text-primary transition-colors mb-6">
<!-- SVG Google Icon -->
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
<!-- Divider -->
<div class="relative flex items-center justify-center mb-6">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-zinc-800"></div>
</div>
<div class="relative bg-zinc-900 px-3 text-sm text-zinc-500">
                    or
                </div>
</div>
<!-- Form -->
<form class="space-y-4">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-sm font-medium text-zinc-300" for="email">Email</label>
<input class="w-full bg-zinc-800 border border-zinc-700 text-primary placeholder-zinc-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-shadow" id="email" placeholder="you@example.com" type="email"/>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="block text-sm font-medium text-zinc-300" for="password">Password</label>
<a class="text-sm font-medium text-zinc-400 hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full bg-zinc-800 border border-zinc-700 text-primary placeholder-zinc-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-shadow pr-10" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-zinc-400 hover:text-zinc-300 focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-zinc-950 font-medium text-sm px-4 py-2.5 rounded-lg hover:bg-zinc-200 transition-colors mt-2" type="submit">
                    Sign In
                </button>
</form>
<!-- Footer -->
<div class="mt-6 text-center text-sm text-zinc-500">
                Don't have an account? 
                <a class="font-medium text-primary hover:underline underline-offset-4" href="#">Sign up</a>
</div>
</div>
</div>
</body></html>
